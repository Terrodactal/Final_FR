# ==============================================================================
# API GATEWAY DEPLOYMENT (Multi-container Pod with Shared Volume)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
  labels:
    app: api-gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-volume-permissions
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - "chmod -R 777 /var/log/app && chown -R 1000:1000 /var/log/app"
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app
      containers:
        # Container 1: API Gateway Microservice
        - name: api-gateway-container
          image: logistics-api-gateway:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: logistics-config
          env:
            - name: PORT
              value: "4000"
            - name: JWT_SECRETE
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: JWT_SECRETE
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app

        # Container 2: Logging Sidecar (Demonstrates multi-container shared volume access)
        - name: log-sidecar-container
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - "echo '=== Log Sidecar Started: Monitoring /var/log/app/gateway.log ===' && touch /var/log/app/gateway.log && tail -n +1 -F /var/log/app/gateway.log"
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app

      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: app-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  labels:
    app: api-gateway-service
spec:
  type: NodePort
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: api-gateway-service
