            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 4000
          - path: /inventory
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 4000
          - path: /orders
            pathType: Prefix
            backend:
