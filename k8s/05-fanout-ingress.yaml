apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ims-fanout-ingress
  annotations:
    ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: ims.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 4000
          - path: /register
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 4000
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 4000
