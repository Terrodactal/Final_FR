apiVersion: v1
kind: Service
metadata:
  name: apigateway-login-service
spec:
  type: NodePort
  ports:
    - targetPort: 4000
      port: 80
      nodePort: 30001
  selector:
    release: beta
    type: gateway-poc
---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  # Internal service (ClusterIP by default) so the Gateway can talk to Registration
  ports:
    - targetPort: 5001
      port: 5001
  selector:
    release: beta
    type: registration-poc