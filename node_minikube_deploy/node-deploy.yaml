# Multi-container API Gateway Pod with Shared Volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
  labels:
    app: api-gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-volume-permissions
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - "chmod -R 777 /var/log/app && chown -R 1000:1000 /var/log/app"
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app
      containers:
        # Container 1: API Gateway Service
        - name: api-gateway-container
          image: logistics-api-gateway:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: JWT_SECRETE
              value: "347186591486#^%%ABCF*##GHE"
            - name: REGISTRATION_URL
              value: "http://registration-service:5001"
            - name: LOGIN_URL
              value: "http://login-service:5002"
            - name: PRODUCT_URL
              value: "http://catalog-service:5003"
            - name: TRACKING_URL
              value: "http://inventory-service:5004"
            - name: ORDER_URL
              value: "http://order-service:5005"
            - name: INBOUND_URL
              value: "http://inbound-service:5006"
            - name: USER_URL
              value: "http://userprofile-service:5007"
            - name: LOG_DIR
              value: "/var/log/app"
            - name: LOG_FILE_PATH
              value: "/var/log/app/gateway.log"
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app

        # Container 2: Logging Sidecar
        - name: log-sidecar-container
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - "echo '=== Log Sidecar Started ===' && touch /var/log/app/gateway.log && tail -n +1 -F /var/log/app/gateway.log"
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app

      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: app-logs-pvc
