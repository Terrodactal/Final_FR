events {
    worker_connections 1024;
}

http {
    # Define the upstream servers to balance the load across
    upstream api_gateway_cluster {
        # Docker's embedded DNS will automatically resolve "api-gateway" 
        # to the IP addresses of all running instances of this service.
        server api-gateway:4000;
    }

    server {
        # The Nginx container listens on port 80 internally 
        # (mapped to 8080 on the host in docker-compose)
        listen 80;

        location / {
            # Forward all incoming traffic to the upstream cluster
            proxy_pass http://api_gateway_cluster;
            
            # Pass essential headers to the backend microservices
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
